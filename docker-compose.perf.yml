# Production-like Performance Benchmark Compose Stack
# Matches Section 2 & Section 23 of Marketplace Load Testing & Performance Engineering Guide
#
# Target Profile: Hetzner CPX31 (4 vCPU, 8 GB RAM)
# Runs Gunicorn with multi-workers instead of development runserver.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tinsae
      POSTGRES_PASSWORD: tinsae
      POSTGRES_DB: tinsae
    ports: ["5434:5432"]
    command: "postgres -c max_connections=300 -c shared_buffers=512MB"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinsae"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: dev
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers \${GUNICORN_WORKERS:-4} --threads \${GUNICORN_THREADS:-2} --worker-class gthread --max-requests 10000 --max-requests-jitter 500 --timeout 30"
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.perf
      - CONN_MAX_AGE=60
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
