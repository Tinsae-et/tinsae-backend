[tool.black]
line-length = 88
target-version = ["py312"]
# Migrations are generated by makemigrations; reformatting them is noise, and
# files the container creates are root-owned so black cannot rewrite them anyway.
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Generated files: skip style, import order and syntax modernisation, but keep
# F and B so a hand-edited RunPython or AddIndexConcurrently is still checked
# for real bugs.
"*/migrations/*" = ["E", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
# "tests_*.py" matters: without it pytest silently skips tests_isolation.py,
# tests_freshness.py and tests_auth.py, which Django's own runner does collect.
python_files = ["test_*.py", "tests.py", "tests_*.py"]
