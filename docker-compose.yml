# Starts the whole local stack with one command: docker compose up
# Two containers: Postgres (db) and the Django app (backend).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tinsae
      POSTGRES_PASSWORD: tinsae
      POSTGRES_DB: tinsae
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinsae"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
